    domain: ai-architect
    topic: foundations
    title: "Fine-tuning: when it beats prompting and RAG"
    why: "Only mentioned in build-buy-or-customize; architects need data needs, cost drivers, and how to evaluate a tuned model."
    priority: 2
    status: published
    notes: "Use official provider fine-tuning docs and the LoRA paper. No prices. Link build-buy-or-customize, choosing-a-model and evaluating-agents."

