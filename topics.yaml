    why: "Shared AI platforms must isolate customers' data, prompts, rate limits and spend; no lesson covers this yet."
    priority: 2
    status: published
    notes: "Cite official cloud SaaS/multi-tenant AI guidance (e.g. AWS, Azure architecture centres). Link ai-gateway, permission-aware-retrieval and ai-cost-and-finops."

