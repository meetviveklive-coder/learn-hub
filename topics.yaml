    priority: 2
    status: published
    notes: "Primary sources: Google SRE book (managing incidents, postmortems), NIST AI 600-1 incident disclosure, OECD AI incident definitions, EU AI Act Art. 73. Link llmops-and-observability and shipping-ai-changes-safely."

  - id: document-and-multimodal-ai
    domain: ai-architect
    topic: building-blocks
    title: "Document and multimodal AI: PDFs, images and audio"
    why: "Much enterprise data is scans, forms and calls; architects need to know how to extract and ground it before RAG."
    priority: 2
    status: published
    notes: "Cite official provider docs for vision/PDF/audio input and a document-extraction service (e.g. Azure Document Intelligence, Amazon Textract). Link rag-architecture and data-readiness-for-ai."

  - id: ai-vendor-risk-assessment
    domain: ai-architect
    topic: security-governance
    title: "Choosing AI vendors safely: data terms, SLAs and lock-in"
    why: "Before signing, architects must check data-use and retention terms, uptime commitments, deprecation policies and exit options."
    priority: 2
    status: published
    notes: "Use official vendor terms/trust pages only as examples; NIST AI 600-1 third-party (GV-6) actions. No prices. Not legal advice. Link deployment-options, privacy-and-data-residency and shipping-ai-changes-safely."

  # Proposed by the lesson agent 2026-11-13 (queue was empty); owner approved in chat.
  - id: human-in-the-loop-design
    domain: ai-architect
    topic: building-blocks
    title: "Human-in-the-loop: approvals, escalation and review queues"
    why: "Risky agent actions need human checkpoints. Architects decide where they go, what the reviewer sees, and how to stop approvals turning into rubber stamps."
    priority: 2
    status: in_review
    notes: "Go beyond agents-in-the-enterprise: risk tiers, approve/edit/reject, pause-and-resume state, timeouts, automation bias. Sources: EU AI Act Art. 14, NIST AI 600-1, framework docs."

  - id: agent-state-and-memory-architecture
    domain: ai-architect
    topic: building-blocks
    title: "Agent state and memory in production: sessions, stores and limits"
    why: "Real agents need state that survives beyond one context window and one server. Architects pick where it lives, how long it stays, and who can see it."
    priority: 2
    status: queued
    notes: "Builds on ai-agents/context-window-and-memory. Cover short-term vs long-term memory, checkpoints, retention and privacy. Official framework docs only."

  - id: measuring-ai-value
    domain: ai-architect
    topic: delivery
    title: "Measuring AI value: KPIs, baselines and business cases"
    why: "Proving return on investment (ROI) decides which pilots get funded. Architects must set baselines and metrics before launch."
    priority: 2
    status: queued
    notes: "Link from-pilot-to-production and ai-cost-and-finops. No invented benchmark numbers; cite sources for any figures."

  # Emerging AI concepts — found by web search 2026-11-14; owner picked these in chat.
  - id: a2a-protocol
    domain: ai-agents
    topic: tools
    title: "A2A: how agents talk to other agents"
    why: "MCP connects an agent to tools; A2A (Agent2Agent, now at the Linux Foundation, v1.0) connects agents to other agents across vendors. Architects need to know which to use where."
    priority: 2
    status: queued
    notes: "Link mcp-basics and integration-patterns. Primary sources: a2a-protocol.org spec, Linux Foundation press release (Apr 2026). Contrast with MCP."

  - id: computer-use-agents
    domain: ai-agents
    topic: tools
    title: "Computer-use and browser agents"
    why: "Agents that see a screen and click and type like a person can automate apps with no API, but they bring new safety and reliability risks."
    priority: 2
    status: queued
    notes: "Use official vendor docs (e.g. Claude computer use, OpenAI computer-using agent) only for facts. Cover when to prefer an API, sandboxing and prompt injection from web pages."

  - id: reasoning-models
    domain: ai-architect
    topic: foundations
    title: "Reasoning models: when 'thinking' is worth the cost"
    why: "Models that reason before answering can replace some multi-step agent chains, but cost more and respond slower. Choosing when to use them is an architecture decision."
    priority: 2
    status: queued
    notes: "Link choosing-a-model and ai-cost-and-finops. Official docs on extended/adaptive thinking and reasoning effort. No benchmark numbers unless sourced."

  - id: sandboxing-agent-code
    domain: harness-engineering
    topic: building-blocks
    title: "Sandboxing: running agent-written code safely"
    why: "Coding and data agents run code they wrote themselves. Isolation (containers, microVMs, network and file limits) decides how much damage a mistake or attack can do."
    priority: 2
    status: queued
    notes: "Link guardrails-and-hooks and agents-in-the-enterprise. Official docs (e.g. Claude Code sandboxing) and OWASP guidance."
