name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Path guard (agent PRs only)
        if: github.event_name == 'pull_request'
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          node scripts/path-guard.mjs "${{ github.head_ref }}" $FILES

      - name: Lesson content check
        run: npm run check:lesson

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
